<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dungeon Elf</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#060310;color:#e8c97a;font-family:'Courier New',monospace}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;letter-spacing:3px;font-size:11px}
</style>
</head>
<body>
<div id="boot">✦ CHARGEMENT DES ARCANES ✦</div>
<script>
(async function(){
  try{
    const response=await fetch('./game-base.html',{cache:'no-cache'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    let html=await response.text();

    // Load the procedural VFX engine before the original game script.
    const scriptOpen='<scr'+'ipt>';
    const vfxTag='<scr'+'ipt src="./vfx-engine.js"></scr'+'ipt>'+scriptOpen;
    html=html.replace(scriptOpen,vfxTag);

    // Pass the rune id into the legacy spellFx hook so each rune gets its own preset.
    html=html.replace(
      'spellFx(e.x,e.y,rune.color,dmg);',
      'spellFx(e.x,e.y,rune.color,dmg,rune.id);'
    );

    // Healing previously had no visual hook at all; send it through the same VFX API.
    html=html.replace(
      'if(dmg<0){player.hp=Math.min(maxHp(),player.hp+Math.abs(dmg));updateHUD();}',
      'if(dmg<0){player.hp=Math.min(maxHp(),player.hp+Math.abs(dmg));updateHUD();spellFx(0,0,rune.color,dmg,rune.id);}'
    );

    const bridgeCode=`
(function(){
  const dungeonVfx=new CanvasVFXEngine({maxActive:900,maxPool:1000,emissionRate:1,quality:1,glow:1});
  window.dungeonVfx=dungeonVfx;

  hitFx=function(x,y,c1,c2){
    dungeonVfx.hit(combat.particles,{x:x,y:y,color:c1,accent:c2});
  };

  spellFx=function(x,y,col,dmg,runeId){
    const center=arcCenter();
    const source={x:center.cx,y:center.cy+arcRadius()*.05};
    const target=(runeId==='square'||dmg<0)?source:{x:x,y:y};
    dungeonVfx.cast(combat.particles,{
      id:runeId||'circle',source:source,target:target,color:col,dmg:dmg,
      superCharged:combat.superCharged
    });
  };

  dotFx=function(x,y,col,dmg){
    dungeonVfx.dot(combat.particles,{x:x,y:y,color:col,dmg:dmg});
  };

  updParts=function(arr,dt){dungeonVfx.update(arr,dt);};
  drawParts=function(arr){dungeonVfx.draw(ctx,arr);};
})();`;
    const bridgeTag='<scr'+'ipt>'+bridgeCode+'</scr'+'ipt>';
    html=html.replace('</body>',bridgeTag+'</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error('[Dungeon Elf] bootstrap failed',err);
    document.getElementById('boot').textContent='✕ ÉCHEC DU CHARGEMENT — '+err.message;
  }
})();
</script>
</body>
</html>
