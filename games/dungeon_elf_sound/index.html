<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dungeon Elf</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#060310;color:#e8c97a;font-family:'Courier New',monospace}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;letter-spacing:3px;font-size:11px}
</style>
</head>
<body>
<div id="boot">✦ CHARGEMENT DES ARCANES ✦</div>
<script>
(async function(){
  try{
    const response=await fetch('./game-base.html',{cache:'no-cache'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    let html=await response.text();

    // The original game stays byte-for-byte intact. The two scripts below are
    // appended after it and replace only its VFX hooks at runtime.
    const scripts='<scr'+'ipt src="./vfx-engine.js"></scr'+'ipt>'+
                  '<scr'+'ipt src="./vfx-bridge.js"></scr'+'ipt>';
    html=html.replace('</body>',scripts+'</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error('[Dungeon Elf] bootstrap failed',err);
    document.getElementById('boot').textContent='✕ ÉCHEC DU CHARGEMENT — '+err.message;
  }
})();
</script>
</body>
</html>
