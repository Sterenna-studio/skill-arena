<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Garden Pro - Farming Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <div class="main-container">
        <header class="game-header">
            <div class="header-left">
                <h1 class="game-title">
                    <span class="title-icon">&#x1F331;</span>
                    <span class="title-text">Gold Garden Pro</span>
                </h1>
                <div class="dimension-counter" id="dimension-counter" style="display: none;">
                    <span class="dim-icon">&#x1F30C;</span>
                    Dimension <span id="dimension-count">1</span>
                    <span class="dim-mult">x<span id="dimension-multiplier">1</span></span>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat" id="stat-balance">
                    <span class="stat-icon">&#x1F4B0;</span>
                    <div class="stat-info">
                        <span class="stat-label">Solde</span>
                        <span class="stat-value" id="balance">0</span>
                    </div>
                </div>
                <div class="stat" id="stat-harvests-wrap">
                    <span class="stat-icon">&#x1F33E;</span>
                    <div class="stat-info">
                        <span class="stat-label">R&eacute;coltes</span>
                        <span class="stat-value" id="harvests">0</span>
                    </div>
                </div>
                <div class="stat" id="stat-streak-wrap">
                    <span class="stat-icon">&#x1F525;</span>
                    <div class="stat-info">
                        <span class="stat-label">Streak</span>
                        <span class="stat-value" id="streak">0</span>
                    </div>
                </div>
                <div class="stat" id="stat-luck-wrap">
                    <span class="stat-icon">&#x1F340;</span>
                    <div class="stat-info">
                        <span class="stat-label">Luck</span>
                        <span class="stat-value" id="stat-luck">10%</span>
                    </div>
                </div>
            </div>
            <nav class="header-buttons">
                <button id="btn-shop" class="btn-header" title="Boutique">
                    <span class="btn-icon">&#x1F6D2;</span>
                    <span class="btn-label">Boutique</span>
                </button>
                <button id="btn-upgrades" class="btn-header" title="Am&eacute;liorations">
                    <span class="btn-icon">&#x2699;&#xFE0F;</span>
                    <span class="btn-label">Am&eacute;liorations</span>
                </button>
                <button id="btn-achievements" class="btn-header" title="Accomplissements">
                    <span class="btn-icon">&#x1F3C6;</span>
                    <span class="btn-label">Succ&egrave;s</span>
                </button>
            </nav>
        </header>

        <div class="game-wrapper">
            <section class="garden-section">
                <div class="garden-header">
                    <h2>&#x1F333; Mon Jardin</h2>
                    <div id="cooldown-bar" class="cooldown-bar" style="display: none;">
                        <div id="cooldown-fill" class="cooldown-fill"></div>
                    </div>
                    <div id="cooldown-text" class="cooldown-text"></div>
                </div>
                <div id="garden-grid" class="garden-grid"></div>
            </section>

            <aside class="sidebar">
                <div class="sidebar-section backpack-section">
                    <h3>&#x1F392; Sac &agrave; Dos</h3>
                    <div id="inventory" class="inventory-grid"></div>
                </div>

                <div class="sidebar-section tools-section">
                    <h3>&#x1F6E0;&#xFE0F; Outils</h3>
                    <div class="tools-grid">
                        <button id="tool-shovel" class="tool-btn" title="D&eacute;terrer">
                            <span class="tool-icon">&#x1F528;</span>
                            <span class="tool-label">D&eacute;terrer</span>
                        </button>
                        <button id="tool-lock" class="tool-btn" title="Verrouiller">
                            <span class="tool-icon">&#x1F512;</span>
                            <span class="tool-label">Verrouiller</span>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section stats-section">
                    <h3>&#x1F4CA; Statistiques</h3>
                    <div class="stats-list">
                        <div class="stat-item">
                            <span class="stat-item-label">&#x1F9D1;&#x200D;&#x1F33E; Jardinier</span>
                            <span class="stat-item-value" id="stat-gardener">Non recrut&eacute;</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-item-label">&#x26A1; Boosts</span>
                            <span class="stat-item-value" id="stat-boosts">0</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div id="notifications" class="notifications-container"></div>

    <div id="shop-modal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>&#x1F6D2; Boutique</h2>
                <button id="btn-close-shop" class="btn-close" aria-label="Fermer">&times;</button>
            </div>
            <div id="shop-grid" class="shop-grid"></div>
        </div>
    </div>

    <div id="upgrades-modal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>&#x2699;&#xFE0F; Am&eacute;liorations</h2>
                <button id="btn-close-upgrades" class="btn-close" aria-label="Fermer">&times;</button>
            </div>
            <div class="upgrades-tabs">
                <button class="tab-btn active" data-tab="slots">Pots</button>
                <button class="tab-btn" data-tab="luck">Chance</button>
                <button class="tab-btn" data-tab="cooldown">Cooldown</button>
                <button class="tab-btn" data-tab="special">Sp&eacute;cial</button>
            </div>
            <div id="upgrades-content" class="upgrades-content"></div>
        </div>
    </div>

    <div id="achievements-modal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>&#x1F3C6; Accomplissements</h2>
                <button id="btn-close-achievements" class="btn-close" aria-label="Fermer">&times;</button>
            </div>
            <div id="achievements-list" class="achievements-list"></div>
        </div>
    </div>

    <div id="confirmation-modal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content confirmation-dialog">
            <h3 id="confirmation-title"></h3>
            <p id="confirmation-text"></p>
            <div class="confirmation-buttons">
                <button id="btn-confirm-yes" class="btn-confirm btn-confirm-yes">Oui</button>
                <button id="btn-confirm-no" class="btn-confirm btn-confirm-no">Non</button>
            </div>
        </div>
    </div>

    <div id="achievement-unlock-popup" class="modal achievement-popup" style="z-index: 1001;">
        <div class="modal-backdrop"></div>
        <div class="achievement-unlock-content">
            <div class="achievement-unlock-icon">&#x1F3C6;</div>
            <h2>Accomplissement D&eacute;verrouill&eacute;!</h2>
            <h3 id="popup-achievement-name"></h3>
            <p id="popup-achievement-reward">+<span></span>&#x1F4B0;</p>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
