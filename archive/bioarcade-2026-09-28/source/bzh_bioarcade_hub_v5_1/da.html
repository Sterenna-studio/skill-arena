<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DA — BioArcade</title>
  <link rel="stylesheet" href="shared/base.css"/>
  <link rel="stylesheet" href="shared/hub.css"/>
  <link rel="stylesheet" href="shared/arcade.css"/>
  <script type="module">
    import { applyDA } from "./shared/da.js";
    import { applySkinToDocument } from "./shared/skins.js";
    applyDA(); applySkinToDocument();
  </script>
</head>
<body class="bg arcade">
  <div class="crt-overlay"></div>
  <header class="topbar">
    <a class="btn small ghost" href="hub.html" data-sfx>← Hub</a>
    <div class="title">DA Selector</div>
    <div class="spacer"></div>
    <button id="hubMute" class="btn small" aria-pressed="false" data-sfx>Mute</button>
  </header>

  <main class="panel arcade-panel" style="max-width:1100px;margin:14px auto;padding:14px;">
    <div class="mini" style="opacity:.9;margin-bottom:10px;">
      Choisis une <b>Direction Artistique</b>. Elle applique un thème global (marquee, couleurs, FX).
    </div>

    <section class="hub-controls-row" style="margin-bottom:10px;">
      <label class="mini" for="hubVolume">Volume</label>
      <input id="hubVolume" type="range" min="0" max="100" step="1" value="25"/>
      <div id="hubVolLabel" class="mini mono">25%</div>
      <div class="spacer"></div>
      <a class="btn small ghost" href="skins.html" data-sfx>Skins →</a>
    </section>

    <div id="daGrid" class="hub-badges"></div>
  </main>

  <script type="module" src="shared/da_page.js"></script>
</body>
</html>
