name: Notify gwen-ha-star

on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger submodule update in gwen-ha-star
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/MutenRock/gwen-ha-star/dispatches \
            -d '{"event_type":"skill-arena-updated"}'
