name: Notify gwen-ha-star-static

on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy + submodule sync in gwen-ha-star-static
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/sterenna-studio/gwen-ha-star-static/dispatches \
            -d '{"event_type":"skill-arena-updated"}'
