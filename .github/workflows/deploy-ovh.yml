name: Deploy Skill Arena

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-skill-arena-ovh
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to OVH via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject Supabase config
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.GHSTAR_SUPABASE_URL }}" > .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.GHSTAR_SUPABASE_ANON }}" >> .env.local

      - name: Build static export
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_KEY }}" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -H "${{ secrets.OVH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote target directory exists
        run: |
          ssh -i ~/.ssh/ovh_key "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}" "mkdir -p ~/nitro/arena"

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ovh_key" \
            out/ "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:~/nitro/arena/"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/ovh_key
