<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nécrobutinage — colonie d’abeilles-vautours</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="/arena/">← Arena</a>
    <h1>Nécrobutinage</h1>
    <div class="calendar" aria-live="polite">
      <span id="season"></span>
      <span id="day"></span>
      <span class="day-track" aria-hidden="true"><i id="day-progress"></i></span>
      <span id="weather"></span>
    </div>
    <span class="spacer"></span>
    <div class="speed" role="group" aria-label="Vitesse du temps">
      <button data-speed="0" aria-pressed="false" title="Pause (Espace)">⏸</button>
      <button data-speed="1" aria-pressed="false" title="Vitesse ×1 (touche 1)">×1</button>
      <button data-speed="2" aria-pressed="false" title="Vitesse ×2 (touche 2)">×2</button>
      <button data-speed="4" aria-pressed="false" title="Vitesse ×4 (touche 3)">×4</button>
    </div>
    <button class="icon-btn" id="help" title="Règles">?</button>
    <button class="icon-btn" id="sound" title="Son"></button>
  </header>

  <section class="resources" aria-label="Ressources de la colonie">
    <div class="res" id="r-workers"><span>🐝 Ouvrières</span><b></b><small></small></div>
    <div class="res" id="r-brood"><span>🥚 Couvain</span><b></b><small></small></div>
    <div class="res" id="r-protein"><span>🥩 Protéines</span><b></b><small></small></div>
    <div class="res" id="r-cerumen"><span>🧱 Cérumen</span><b></b><small></small></div>
    <div class="res" id="r-infection"><span>☣️ Infection</span><b></b><div class="gauge"><i id="infection-fill"></i></div></div>
  </section>

  <main class="layout">
    <section class="panel">
      <h2>Forêt</h2>
      <div class="map-wrap" id="map-wrap">
        <canvas id="map" aria-label="Carte de la forêt : le nid et les carcasses repérées"></canvas>
        <p id="alert" class="alert" hidden></p>
      </div>
      <h3>Carcasses repérées <span>équipes de butineuses</span></h3>
      <p id="carcasses-empty" class="empty" hidden>Aucune carcasse en vue. Les éclaireuses cherchent.</p>
      <ul id="carcasses" class="carcasses"></ul>
    </section>

    <section class="panel">
      <h2>Colonie</h2>
      <h3>Rôles <span>répartition des ouvrières</span></h3>
      <ul id="roles" class="roles"></ul>

      <h3>Réserves <span id="pots-summary"></span></h3>
      <div id="pots" class="pots" aria-label="Pots de cérumen"></div>
      <p id="raw" class="raw"></p>
      <div class="build">
        <button class="action" id="build-pot">🍯 Pot de cérumen<small id="build-pot-cost"></small></button>
        <button class="action" id="build-cells">🥚 Cellules de couvain<small id="build-cells-cost"></small></button>
      </div>

      <h3>Microbiome <span id="research-points"></span></h3>
      <ul id="research" class="research"></ul>

      <h3>Journal</h3>
      <ol id="log" class="log"></ol>
    </section>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="card" id="overlay-card" role="dialog" aria-modal="true"></div>
  </div>

  <script src="fx.js"></script>
  <script src="game.js"></script>
</body>
</html>
